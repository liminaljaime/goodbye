<title>Just One More Goodbye</title>
<style>
  :root{
    --bg:#0d1321;
    --panel:#171f33;
    --panel-edge:#2a3559;
    --wall:#22284a;
    --wall-dark:#171b33;
    --floor:#e8c99b;
    --floor-dark:#d9b686;
    --ink:#f4ecd8;
    --ink-dim:#a9a3c9;
    --accent:#ff5d73;
    --accent-2:#5ee6c8;
    --accent-3:#ffd257;
    --door:#5ee6c8;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0d1321; --panel:#171f33; --panel-edge:#2a3559; --ink:#f4ecd8;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 16px 24px;
    font-family:'Press Start 2P', monospace;
  }
  h1{display:none;}
  .cabinet{
    width:100%;
    max-width:720px;
    background:linear-gradient(180deg,var(--panel),var(--bg));
    border:4px solid var(--panel-edge);
    border-radius:14px;
    padding:14px;
    box-shadow:0 10px 0 rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.03);
  }
  .marquee{
    text-align:center;
    font-size:11px;
    letter-spacing:1px;
    color:var(--accent-3);
    text-shadow:0 2px 0 rgba(0,0,0,.5);
    margin-bottom:10px;
    line-height:1.8;
  }
  .marquee .sub{
    display:block;
    font-size:7px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .screen-wrap{
    position:relative;
    width:100%;
    aspect-ratio:320/240;
    background:#000;
    border-radius:6px;
    overflow:hidden;
    border:3px solid var(--wall-dark);
    box-shadow: inset 0 0 24px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04);
  }
  canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    display:block;
  }
  .controls-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    gap:10px;
    flex-wrap:wrap;
  }
  .hint{
    font-size:7px;
    color:var(--ink-dim);
    line-height:1.9;
  }
  .btn{
    font-family:'Press Start 2P', monospace;
    font-size:8px;
    background:var(--panel-edge);
    color:var(--ink);
    border:2px solid var(--ink-dim);
    border-radius:4px;
    padding:8px 10px;
    cursor:pointer;
  }
  .btn:active{ transform:translateY(1px); }
  .btn:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .footer{
    text-align:center;
    margin-top:14px;
    font-size:7px;
    color:var(--ink-dim);
    line-height:1.8;
  }
  @media (max-width:480px){
    .marquee{ font-size:9px; }
    .marquee .sub{ font-size:6px; }
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

<div class="cabinet">
  <div class="marquee">JUST ONE MORE GOODBYE
    <span class="sub">you can leave whenever you want</span>
  </div>
  <div class="screen-wrap">
    <canvas id="game" width="320" height="240"></canvas>
  </div>
  <div class="controls-row">
    <div class="hint">ARROWS / WASD MOVE<br>WALK INTO A GUEST TO TALK<br>SPACE ADVANCES</div>
    <button class="btn" id="soundBtn" type="button">SOUND: OFF</button>
  </div>
  <div class="footer">A PARTY YOU CANNOT LEAVE &middot; EST. TONIGHT</div>
</div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  var TILE = 20, COLS = 16, ROWS = 11, STATUS_H = 20;

  // ---------- map ----------
  // # wall, . floor, D door(opening in wall). Furniture and the dance floor are layered on separately.
  var MAP = [
    "################",
    "#..............#",
    "#..............#",
    "#..............#",
    "#..............D",
    "#..............#",
    "#..............#",
    "#..............#",
    "#..............#",
    "#..............#",
    "################"
  ];

  var FURNITURE = [
    {gx:3, gy:1, type:'T'}, {gx:12, gy:1, type:'C'},
    {gx:5, gy:2, type:'T'}, {gx:12, gy:2, type:'T'},
    {gx:3, gy:3, type:'C'}, {gx:11, gy:3, type:'T'},
    {gx:2, gy:6, type:'T'}, {gx:13, gy:6, type:'C'},
    {gx:3, gy:9, type:'C'}, {gx:12, gy:9, type:'T'}
  ];
  var FURNITURE_MAP = {};
  FURNITURE.forEach(function(f){ FURNITURE_MAP[f.gx+','+f.gy] = f.type; });

  var DANCE_X0 = 5, DANCE_X1 = 10, DANCE_Y0 = 4, DANCE_Y1 = 9;
  function isDanceFloor(gx, gy){
    return gx >= DANCE_X0 && gx <= DANCE_X1 && gy >= DANCE_Y0 && gy <= DANCE_Y1;
  }

  function solidAt(gx, gy){
    if (gy < 0 || gy >= ROWS || gx < 0 || gx >= COLS) return true;
    var c = MAP[gy][gx];
    if (c === '#') return true;
    return !!FURNITURE_MAP[gx+','+gy];
  }
  function isDoor(gx, gy){ return MAP[gy] && MAP[gy][gx] === 'D'; }

  // ---------- palette per-actor ----------
  var GUEST_COLORS = [
    ['#ff5d73','#c93b52'], ['#5ee6c8','#2fae95'], ['#ffd257','#cf9f22'],
    ['#c58bff','#8a54d1'], ['#ff9e5e','#d5702c'],
    ['#a4e05a','#6fa930'], ['#ff7ec9','#d3489e'], ['#f4ecd8','#b7ad8f']
  ];
  var PLAYER_COLOR = ['#7ec4ff','#3f8fd6'];
  var NAME_POOL = ["Sarah","Tom","Priya","Mike","Elena","Dave","Wendy",
    "Nia","Carlos","Farah","Ben","Yuki","Oscar","Lena","Theo","Mia"];
  var namePtr = 0;
  function nextName(loop){
    var n = NAME_POOL[namePtr % NAME_POOL.length];
    namePtr++;
    if (namePtr > NAME_POOL.length) n += " (again)";
    return n;
  }

  // ---------- character voice database ----------
  // Each guest has a fixed mechanical shape (how the conversation plays out)
  // and a fully bespoke voice across five escalating loop states:
  //   fresh  -- loop 1, a completely normal goodbye
  //   tier1  -- loop 2, something feels slightly familiar
  //   tier2  -- loop 3, they start noticing the pattern
  //   tier3  -- loop 4, they're aware something's wrong, in their own voice
  //   tier4  -- loop 5+, fully adapted to the loop, still in character
  // A brand-new arrival guest is always played at "fresh" (they don't know
  // what's going on yet) via effectiveTier(); everyone else uses tier().
  var CHARACTERS = {
    Sarah: {
      gender: "f",
      lines: {
        fresh: { reaction: "Oh! Already? Have you eaten?", closingHint: "Go on then. Oh -- and don't forget {next}." },
        tier1: { reaction: "Again? Okay. Have you eaten this time?", closingHint: "Go on. And {next} too, don't forget." },
        tier2: { reaction: "You look shattered. Sit -- no? Okay.", closingHint: "Go on, love. And {next}, obviously." },
        tier3: { reaction: "Right. Okay. You've done this a lot tonight.", closingHint: "Go on then. {next}. Same as ever." },
        tier4: { reaction: "Of course. Here we go again.", closingHint: "Go on. {next}. Always {next}." }
      }
    },
    Tom: {
      gender: "m",
      lines: {
        fresh: { reaction: "Mate, no way, already?", closingHint: "Love you, legend. Oh, catch {next} before you go." },
        tier1: { reaction: "Wait, didn't we just do this?", closingHint: "Love you, legend. And {next} too, yeah?" },
        tier2: { reaction: "Mate, you're winding me up.", closingHint: "Whatever, love you. Catch {next} as well." },
        tier3: { reaction: "We are DEFINITELY doing this again.", closingHint: "Love you, legend. {next}. Same as always." },
        tier4: { reaction: "Course we are. Classic us.", closingHint: "Love you. {next}. Obviously." }
      }
    },
    Priya: {
      gender: "f",
      lines: {
        fresh: { reaction: "Oh my god, wait, who are you again?", closingHint: "Bye! Oh -- and say bye to {next} too!" },
        tier1: { reaction: "Wait, have I said bye to you already?", closingHint: "Bye! And {next}, I think?" },
        tier2: { reaction: "Oh my god, have we done this? I'm the worst.", closingHint: "Bye! {next} too, probably." },
        tier3: { reaction: "I don't know your name and we've done this loads.", closingHint: "Bye! {next}. Again, probably." },
        tier4: { reaction: "Story of my night, honestly.", closingHint: "Bye! {next}. Same as always." }
      }
    },
    Mike: {
      gender: "m",
      lines: {
        fresh: { reaction: "Oh -- yeah, go on. Anyway, the van--", closingHint: "Love you, mate. Catch {next} before you go." },
        tier1: { reaction: "Go on -- wait, did I tell you the van thing?", closingHint: "Love you, mate. And {next}, yeah?" },
        tier2: { reaction: "Go on, mate -- have I told you this one already?", closingHint: "Love you. {next} too, mate." },
        tier3: { reaction: "Go on -- this story keeps getting longer, doesn't it.", closingHint: "Love you, mate. {next}. Same as always." },
        tier4: { reaction: "Go on, go on. I know how it ends anyway.", closingHint: "Love you. {next}. Obviously." }
      }
    },
    Elena: {
      gender: "f",
      lines: {
        fresh: { reaction: "Yeah, sound.", closingHint: "Night, mate. Catch {next} on your way out." },
        tier1: { reaction: "Round two. Sound.", closingHint: "Night. And {next}." },
        tier2: { reaction: "Third one, is it. Sound.", closingHint: "Night. {next}, obviously." },
        tier3: { reaction: "Sound. This keeps happening.", closingHint: "Night. {next}. Same as ever." },
        tier4: { reaction: "Sound. Same as ever.", closingHint: "Night. {next}. Always." }
      }
    },
    Dave: {
      gender: "m",
      lines: {
        fresh: { reaction: "Mate, no! One more?", closingHint: "Alright, go on. And {next}, mate -- can't skip {pron_obj}." },
        tier1: { reaction: "You always say that. One more?", closingHint: "Fine, go on. {next} too, mate." },
        tier2: { reaction: "Third one of these, mate.", closingHint: "Go on then. {next}, obviously." },
        tier3: { reaction: "Number four, mate. Legend.", closingHint: "Go on. {next}. Same as ever." },
        tier4: { reaction: "Lost count, mate. Respect.", closingHint: "Go on. {next}. Always." }
      }
    },
    Wendy: {
      gender: "f",
      lines: {
        fresh: { reaction: "Wait -- come here, come here!", closingHint: "Love you SO much! Oh -- say bye to {next} too!" },
        tier1: { reaction: "Come here one more time!", closingHint: "Love you! And {next}, please!" },
        tier2: { reaction: "Wait, have we done this? Come here anyway!", closingHint: "Love you all! {next} too!" },
        tier3: { reaction: "This keeps happening! Come here!", closingHint: "Love you! {next}. Same as always!" },
        tier4: { reaction: "Every time! Come here!", closingHint: "Love you! {next}. Always!" }
      }
    },
    Nia: {
      gender: "f",
      lines: {
        fresh: { reaction: "Wait, you HAVE to hear this!", closingHint: "Fine, go. {next}'s around somewhere, say bye." },
        tier1: { reaction: "Did I play you this one already?", closingHint: "Bye. {next} too." },
        tier2: { reaction: "I've definitely played you this before.", closingHint: "Bye. {next}, obviously." },
        tier3: { reaction: "Same transition. Every time.", closingHint: "Bye. {next}. Same as ever." },
        tier4: { reaction: "Stopped keeping track, honestly.", closingHint: "Bye. {next}. Always." }
      }
    },
    Carlos: {
      gender: "m",
      lines: {
        fresh: { reaction: "No but listen, this is important--", closingHint: "Stay safe out there. And {next} -- say bye to {pron_obj} too." },
        tier1: { reaction: "Have I told you this theory already?", closingHint: "Think about it. {next} too." },
        tier2: { reaction: "THREE goodbyes. That's not nothing.", closingHint: "Be careful. {next}, obviously." },
        tier3: { reaction: "Four goodbyes. That's a structure.", closingHint: "Stay sharp. {next}. Same as ever." },
        tier4: { reaction: "You get it now, right? You have to get it.", closingHint: "See you in the next one. {next}. Always." }
      }
    },
    Farah: {
      gender: "f",
      lines: {
        fresh: { reaction: "Leaving? Lucky you.", closingHint: "Text me when you're home. And {next}, apparently." },
        tier1: { reaction: "You said that already. Lucky you, still.", closingHint: "Go on then. {next} too." },
        tier2: { reaction: "Third time. I'm keeping count.", closingHint: "Go on. {next}, obviously." },
        tier3: { reaction: "Fourth time. That's a pattern now.", closingHint: "Go on. {next}. Same as ever." },
        tier4: { reaction: "Lost count. So have you.", closingHint: "Go on. {next}. Always." }
      }
    },
    Ben: {
      gender: "m",
      lines: {
        fresh: { reaction: "Wait, you can't leave before my song!", closingHint: "Love you, mate. Catch {next} before you go." },
        tier1: { reaction: "You said that last time, before my song too.", closingHint: "Love you. {next} too." },
        tier2: { reaction: "Third time missing my key change!", closingHint: "Love you. {next}, obviously." },
        tier3: { reaction: "Fourth time! You're doing this on purpose!", closingHint: "Love you. {next}. Same as ever." },
        tier4: { reaction: "One note away, forever, apparently.", closingHint: "Love you. {next}. Always." }
      }
    },
    Yuki: {
      gender: "f",
      lines: {
        fresh: { reaction: "Oh -- um, okay! Bye!", closingHint: "This was really nice. Um, {next} too, if you get the chance." },
        tier1: { reaction: "Oh. Um. Bye again?", closingHint: "Still nice though. {next}, I think." },
        tier2: { reaction: "Sorry -- is this the third time?", closingHint: "Um. {next}, probably." },
        tier3: { reaction: "Oh gosh. Um. Bye again.", closingHint: "Sorry. {next}. Same as before." },
        tier4: { reaction: "Oh. Bye. I've stopped keeping track.", closingHint: "Um. {next}. Always, I think." }
      }
    },
    Oscar: {
      gender: "m",
      lines: {
        fresh: { reaction: "WAIT. Are you leaving?", closingHint: "Fine! Text me. Also {next} -- say bye to {next}." },
        tier1: { reaction: "Wait -- have we done this already?", closingHint: "Mental. {next} too." },
        tier2: { reaction: "THIRD TIME. Something's off, mate.", closingHint: "Mad. {next}, obviously." },
        tier3: { reaction: "I keep having this conversation, mate.", closingHint: "Mental. {next}. Same as always." },
        tier4: { reaction: "This just happens now, apparently.", closingHint: "Love it though. {next}. Always." }
      }
    },
    Lena: {
      gender: "f",
      lines: {
        fresh: { reaction: "NO. Don't. It's just getting GOOD!", closingHint: "Fine, go! Love you! Oh -- and {next}!!" },
        tier1: { reaction: "It's STILL just getting good, somehow!", closingHint: "Love you! {next} too!" },
        tier2: { reaction: "THIRD time? It's still SO good though!", closingHint: "Love you! {next}, obviously!" },
        tier3: { reaction: "Four times?! Wildest night ever!", closingHint: "Love you! {next}. Same as ever!" },
        tier4: { reaction: "Always just getting good, apparently!", closingHint: "Love you! {next}. Always!" }
      }
    },
    Theo: {
      gender: "m",
      lines: {
        fresh: { reaction: "Wait, have you tried this?!", closingHint: "Love you. Find {next} before you go." },
        tier1: { reaction: "Did you try it last time? Taste it again!", closingHint: "Love you. {next} too." },
        tier2: { reaction: "Third goodbye and it's STILL not ready!", closingHint: "Love you. {next}, obviously." },
        tier3: { reaction: "It's ALMOST ready. Been almost ready for hours.", closingHint: "Love you. {next}. Same as ever." },
        tier4: { reaction: "We're just tasting sauce forever now, aren't we.", closingHint: "Love you. {next}. Always." }
      }
    },
    Mia: {
      gender: "f",
      lines: {
        fresh: { reaction: "Oh my god, same! Teach me your ways!", closingHint: "Good luck out there. {next}, apparently." },
        tier1: { reaction: "You're really trying again? Respect.", closingHint: "Go. {next} too." },
        tier2: { reaction: "Third attempt? Same. I believe you.", closingHint: "Go. {next}, obviously." },
        tier3: { reaction: "Four times. I believe every word.", closingHint: "Go. {next}. Same as ever." },
        tier4: { reaction: "You're basically my proof at this point.", closingHint: "Go. {next}. Always." }
      }
    }
  };

  var TIER_KEYS = ['fresh', 'tier1', 'tier2', 'tier3', 'tier4'];

  function characterFor(name){
    var base = name.replace(/ \(again\)$/, '');
    return CHARACTERS[base] || CHARACTERS.Sarah;
  }

  var FLOOR_SPOTS = [];
  for (var gy=1; gy<ROWS-1; gy++){
    for (var gx=1; gx<COLS-1; gx++){
      if (!solidAt(gx,gy)) FLOOR_SPOTS.push([gx,gy]);
    }
  }
  function farFromDoor(spot){
    var dx = spot[0]-15, dy = spot[1]-4;
    return (dx*dx+dy*dy) > 9;
  }
  function randomSpot(exclude){
    var pool = FLOOR_SPOTS.filter(function(s){
      if (!farFromDoor(s)) return false;
      for (var i=0;i<exclude.length;i++){
        if (exclude[i][0]===s[0] && exclude[i][1]===s[1]) return false;
      }
      return true;
    });
    if (!pool.length) pool = FLOOR_SPOTS;
    return pool[(Math.random()*pool.length)|0];
  }

  // ---------- state ----------
  var STATE_TITLE = 0, STATE_PLAY = 1, STATE_DIALOGUE = 2;
  var state = STATE_TITLE;

  var player = { gx:2, gy:5, facing:'down', moveT:0 };
  var guests = [];      // active guests on the floor
  var queue = [];        // ids currently pending a goodbye, in required order
  var roster = [];       // every guest id ever, in the order they first arrived
  var loopCount = 0;
  var goodbyesRemaining = 0;
  var lastFarewellName = null;  // who you most recently said a proper goodbye to
  var tableBumpStreak = 0;      // consecutive attempts to walk into a table
  var playerEasterEgg = null;   // {startT} while the beer animation plays

  function guestById(id){
    for (var i=0;i<guests.length;i++) if (guests[i].id === id) return guests[i];
    return null;
  }

  var dialogue = { steps: [], idx:0, selected:0, active:false, onDone:null };

  function occupiedSpots(){
    var arr = [[player.gx,player.gy],[15,4]];
    guests.forEach(function(g){ arr.push([g.gx,g.gy]); });
    return arr;
  }

  function spawnGuest(name, spot){
    var col = GUEST_COLORS[(Math.random()*GUEST_COLORS.length)|0];
    var g = {
      id: 'g'+Math.random().toString(36).slice(2),
      name: name, gx: spot[0], gy: spot[1],
      color: col[0], shade: col[1],
      hat: Math.random() < 0.5,
      bob: Math.random()*Math.PI*2,
      farewelled: false,
      arrival: false,
      facing: 'down',
      nextMoveAt: 0
    };
    guests.push(g);
    roster.push(g.id);
    return g;
  }

  function startRound1(){
    guests = []; queue = []; roster = []; namePtr = 0; loopCount = 0; lastFarewellName = null;
    player.gx = 2; player.gy = 5;
    var names = [];
    for (var i=0;i<7;i++) names.push(nextName());
    var used = [[player.gx,player.gy],[15,4]];
    names.forEach(function(n){
      var spot = randomSpot(used);
      used.push(spot);
      var g = spawnGuest(n, spot);
      queue.push(g.id);
    });
    goodbyesRemaining = queue.length;
  }

  function currentTarget(){
    if (!queue.length) return null;
    var id = queue[0];
    for (var i=0;i<guests.length;i++) if (guests[i].id===id) return guests[i];
    return null;
  }

  // ---------- dialogue content ----------
  function tier(){ return Math.min(loopCount, 4); }
  function effectiveTier(guest){ return guest.arrival ? 0 : tier(); }

  var PRONOUNS = {
    m: { subj:'he', subjCap:'He', obj:'him' },
    f: { subj:'she', subjCap:'She', obj:'her' }
  };

  // {name} = the guest you're talking to, {next} = who they'll point you at,
  // {pron}/{Pron}/{pron_obj} = the pronoun of whoever {next} refers to.
  function sub(str, guest, nextName, nextGender){
    if (!str) return str;
    var p = PRONOUNS[nextGender] || PRONOUNS.f;
    return str.split('{name}').join(guest.name)
      .split('{next}').join(nextName || '')
      .split('{Pron}').join(p.subjCap)
      .split('{pron}').join(p.subj)
      .split('{pron_obj}').join(p.obj);
  }

  // The player is a character too, with one evolving voice that persists
  // across every guest -- polite and a bit distracted at first, then
  // increasingly direct, suspicious, and finally just flatly exhausted.
  var OPENER = [
    "Hey {name}, I'm just coming to say goodbye.",
    "{name}, coming to say bye again.",
    "{name}. Saying goodbye. Again.",
    "{name}. Same as before -- bye.",
    "{name}. I really must go."
  ];
  var CLOSE = ["Okay, bye!", "Okay, bye.", "Right, bye.", "Bye.", "Yep. Bye."];

  // every conversation is exactly four lines: you open, they react in their
  // own voice, you close, and their goodbye tells you who's next.
  function buildScript(guest, nextName, t){
    var ch = characterFor(guest.name);
    var L = ch.lines[TIER_KEYS[t]] || ch.lines.fresh;
    var nextGender = nextName ? characterFor(nextName).gender : null;
    var steps = [
      {type:'line', who:'you', text: sub(OPENER[t], guest, nextName, nextGender)},
      {type:'line', who:guest.name, text: L.reaction},
      {type:'line', who:'you', text: CLOSE[t]}
    ];
    var closing = nextName ? sub(L.closingHint, guest, nextName, nextGender) : "Bye!";
    steps.push({type:'line', who:guest.name, text: closing, end:true});
    return steps;
  }

  function alreadySaidByeSteps(guest){
    var t = effectiveTier(guest);
    var lines = [
      "We already did the whole goodbye thing!",
      "Yes, yes, you already left. Sort of.",
      "We've said goodbye a worrying number of times now.",
      "Okay, I'm not doing this again, I remember this one.",
      "Again? We are BOTH going to be here forever at this rate."
    ];
    return [ {type:'line', who:guest.name, text:lines[Math.min(t,lines.length-1)], end:true} ];
  }

  function waitSteps(guest, target){
    var t = effectiveTier(guest);
    var mineLines = [
      "Oh -- sorry, I'm just trying to find the door!",
      "Sorry, sorry -- still working my way round.",
      "I know, I know, I'm not done yet.",
      "I really must go, I'm just doing it in the wrong order apparently.",
      "Sorry -- wrong one. Again."
    ];
    var theirsLines;
    if (t === 0) theirsLines = "Oh! You haven't said bye to " + target.name + " yet!";
    else if (t === 1) theirsLines = "You're doing this again? Go find " + target.name + ".";
    else if (t === 2) theirsLines = "You're still here? Go bother " + target.name + " instead.";
    else if (t === 3) theirsLines = "We are all still here. Try " + target.name + ", not me.";
    else theirsLines = target.name + ". It's always " + target.name + " now, isn't it.";
    return [ {type:'line', who:'you', text:mineLines[Math.min(t,mineLines.length-1)]}, {type:'line', who:guest.name, text:theirsLines, end:true} ];
  }

  function doorSteps(){
    var t = tier();
    var lines = [
      "Okay, honestly, I've still got people to say bye to.",
      "No, not yet -- someone will notice.",
      "Nope. The door hasn't earned it yet.",
      "Everyone would just say hi again anyway, wouldn't they.",
      "I really must go. The door knows that. The door doesn't care."
    ];
    return [ {type:'line', who:'you', text:lines[Math.min(t,lines.length-1)], end:true} ];
  }

  var DANCE_LINES = [
    "Oh my god, I LOVE this song!",
    "Wait, is this-- yeah, this is my song.",
    "Shh, listen, this is the best bit.",
    "This bassline, though.",
    "Ugh, I can't leave now, this tune's incredible.",
    "Two more seconds, I need to hear the drop.",
    "This is basically the best song ever written."
  ];
  function danceLine(){ return DANCE_LINES[(Math.random()*DANCE_LINES.length)|0]; }

  function withDanceComment(steps, guest){
    if (!isDanceFloor(guest.gx, guest.gy)) return steps;
    for (var i=0;i<steps.length;i++){
      if (steps[i].type === 'line' && steps[i].who === guest.name){
        var copy = steps.slice();
        var line = copy[i];
        copy[i] = { type:'line', who:line.who, text: danceLine() + " " + line.text, end: line.end };
        return copy;
      }
    }
    return steps;
  }

  function shuffleArray(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = (Math.random()*(i+1))|0;
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var CALLBACK_LINES = [
    "Oh -- did you just do the whole thing with {name}?",
    "Wait, weren't you just saying bye to {name}?",
    "I saw you with {name} a second ago -- how'd that go?",
    "Did {name} keep you as long as usual?",
    "Is {name} alright? {Pron} looked a bit emotional back there."
  ];
  function callbackLine(lastName, lastGender){
    var p = PRONOUNS[lastGender] || PRONOUNS.f;
    var t = CALLBACK_LINES[(Math.random()*CALLBACK_LINES.length)|0];
    return t.split('{name}').join(lastName).split('{Pron}').join(p.subjCap);
  }

  // from loop 2 onward, a guest might reference the person you just farewelled
  function withCallbackComment(steps, guest, t){
    if (t < 1) return steps;
    if (!lastFarewellName || lastFarewellName === guest.name) return steps;
    if (Math.random() > 0.4) return steps;
    var lastChar = characterFor(lastFarewellName);
    var line = callbackLine(lastFarewellName, lastChar.gender);
    for (var i=0;i<steps.length;i++){
      if (steps[i].type === 'line' && steps[i].who === guest.name){
        var copy = steps.slice();
        var s = copy[i];
        copy[i] = { type:'line', who:s.who, text: line + " " + s.text, end: s.end };
        return copy;
      }
    }
    return steps;
  }

  var ARRIVAL_REASONS = [
    "has come back to the party from the off license with more booze",
    "has come back to the party from the kitchen with a fresh bag of crisps",
    "has come back to the party from the garden, still holding a cigarette",
    "has finally made it back from the bathroom queue",
    "has come back to the party from the car with a different speaker",
    "has come back to the party from the corner shop with more ice"
  ];

  // ---------- dialogue box control ----------
  function currentStep(){ return dialogue.steps[dialogue.idx]; }

  function gotoStep(i){
    if (i >= dialogue.steps.length){ closeDialogue(); return; }
    dialogue.idx = i;
    dialogue.selected = 0;
  }

  function openScript(steps, onDone){
    dialogue.steps = steps;
    dialogue.active = true;
    dialogue.onDone = onDone || null;
    state = STATE_DIALOGUE;
    gotoStep(0);
  }

  function closeDialogue(){
    dialogue.active = false;
    state = STATE_PLAY;
    var cb = dialogue.onDone; dialogue.onDone = null;
    if (cb) cb();
  }

  function advanceDialogue(){
    var step = currentStep();
    if (!step){ closeDialogue(); return; }
    if (step.type === 'choice') return;
    if (step.end){ closeDialogue(); return; }
    gotoStep(dialogue.idx+1);
  }

  function chooseOption(i){
    var step = currentStep();
    if (!step || step.type !== 'choice') return;
    var opt = step.options[i];
    if (!opt) return;
    gotoStep(opt.next);
  }

  function sayGoodbyeTo(guest){
    guest.farewelled = true;
    lastFarewellName = guest.name;
    queue.shift();
    goodbyesRemaining = queue.length;
    if (queue.length === 0){
      spawnArrival();
    }
  }

  function spawnArrival(){
    var name = nextName();
    var reason = ARRIVAL_REASONS[(Math.random()*ARRIVAL_REASONS.length)|0];
    var used = occupiedSpots();
    var spot = randomSpot(used);
    var g = spawnGuest(name, spot);
    g.arrival = true;
    queue = [g.id];
    goodbyesRemaining = queue.length;
    var steps = [
      {type:'line', who:'SYSTEM', text: name + " " + reason + ".", system:true, end:true}
    ];
    openScript(steps, null);
  }

  function resetRoster(excludeId, order){
    loopCount++;
    queue = order || shuffleArray(roster.filter(function(id){ return id !== excludeId; }));
    queue.forEach(function(id){
      var g = guestById(id);
      if (g) g.farewelled = false;
    });
    goodbyesRemaining = queue.length;
  }

  function tryTalk(guest){
    var target = currentTarget();
    if (guest.farewelled){
      openScript(alreadySaidByeSteps(guest), null);
      return;
    }
    if (target && target.id === guest.id){
      var t = effectiveTier(guest);
      var nextName_ = null;
      var newOrder = null;
      if (guest.arrival){
        // the new loop's order shuffles here so the arrival's hint always
        // points at whoever the reshuffled queue will actually start with
        newOrder = shuffleArray(roster.filter(function(id){ return id !== guest.id; }));
        var firstGuest = newOrder.length ? guestById(newOrder[0]) : null;
        nextName_ = firstGuest ? firstGuest.name : null;
      } else {
        var afterId = queue[1];
        if (afterId){
          var afterGuest = guestById(afterId);
          nextName_ = afterGuest ? afterGuest.name : null;
        }
      }
      var steps = withCallbackComment(withDanceComment(buildScript(guest, nextName_, t), guest), guest, t);
      openScript(steps, function(){
        lastFarewellName = guest.name;
        if (guest.arrival){
          guest.farewelled = true;
          guest.arrival = false;
          resetRoster(guest.id, newOrder);
        } else {
          sayGoodbyeTo(guest);
        }
      });
    } else {
      openScript(waitSteps(guest, target), null);
    }
  }

  function tryDoor(){
    openScript(doorSteps(), null);
  }

  // easter egg: walk into a table three times in a row and help yourself
  function triggerBeerEasterEgg(){
    playerEasterEgg = { startT: performance.now() };
    var steps = [
      {type:'line', who:'SYSTEM', text:"Mmmmm... delicious beer.", system:true},
      {type:'line', who:'SYSTEM', text:"*hic*", system:true, end:true}
    ];
    openScript(steps, null);
  }

  // ---------- ambient guest movement ----------
  function tileOccupied(gx, gy, excludeGuest){
    if (player.gx === gx && player.gy === gy) return true;
    for (var i=0;i<guests.length;i++){
      var g = guests[i];
      if (g !== excludeGuest && g.gx === gx && g.gy === gy) return true;
    }
    return false;
  }

  var WANDER_DIRS = [[0,-1,'up'],[0,1,'down'],[-1,0,'left'],[1,0,'right']];

  function updateGuestAI(t){
    guests.forEach(function(g){
      if (t < g.nextMoveAt) return;
      g.nextMoveAt = t + 1200 + Math.random()*2600;
      if (Math.random() > 0.45) return; // often just lingers -- gathering, chatting
      var dirs = WANDER_DIRS.slice().sort(function(){ return Math.random()-0.5; });
      for (var i=0;i<dirs.length;i++){
        var nx = g.gx+dirs[i][0], ny = g.gy+dirs[i][1];
        if (isDoor(nx,ny)) continue;
        if (solidAt(nx,ny)) continue;
        if (tileOccupied(nx,ny,g)) continue;
        g.gx = nx; g.gy = ny; g.facing = dirs[i][2];
        break;
      }
    });
  }

  // ---------- input ----------
  var lastMove = 0;
  var MOVE_INTERVAL = 100;

  var DIR_KEYS = {
    'ArrowUp':[0,-1,'up'], 'w':[0,-1,'up'], 'W':[0,-1,'up'],
    'ArrowDown':[0,1,'down'], 's':[0,1,'down'], 'S':[0,1,'down'],
    'ArrowLeft':[-1,0,'left'], 'a':[-1,0,'left'], 'A':[-1,0,'left'],
    'ArrowRight':[1,0,'right'], 'd':[1,0,'right'], 'D':[1,0,'right']
  };

  function attemptMove(dx, dy, facing){
    var now = performance.now();
    if (now - lastMove < MOVE_INTERVAL) return;
    lastMove = now;
    player.facing = facing;
    var nx = player.gx+dx, ny = player.gy+dy;

    if (isDoor(nx,ny)){ tableBumpStreak = 0; tryDoor(); return; }

    if (solidAt(nx,ny)){
      if (FURNITURE_MAP[nx+','+ny] === 'T'){
        tableBumpStreak++;
        if (tableBumpStreak >= 3){
          tableBumpStreak = 0;
          triggerBeerEasterEgg();
        }
      } else {
        tableBumpStreak = 0;
      }
      return;
    }
    tableBumpStreak = 0;

    var bump = null;
    for (var i=0;i<guests.length;i++){
      if (guests[i].gx===nx && guests[i].gy===ny){ bump = guests[i]; break; }
    }
    if (bump){ tryTalk(bump); return; }

    player.gx = nx; player.gy = ny;
  }

  window.addEventListener('keydown', function(e){
    var k = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter','w','a','s','d','W','A','S','D'].indexOf(k) !== -1){
      e.preventDefault();
    }

    if (state === STATE_TITLE){
      if (k === ' ' || k === 'Enter'){ beginGame(); }
      return;
    }
    if (state === STATE_DIALOGUE){
      var step = currentStep();
      if (step && step.type === 'choice'){
        if (k === 'ArrowUp'){ dialogue.selected = (dialogue.selected + step.options.length - 1) % step.options.length; }
        else if (k === 'ArrowDown'){ dialogue.selected = (dialogue.selected + 1) % step.options.length; }
        else if (k === ' ' || k === 'Enter'){ chooseOption(dialogue.selected); }
        else if (k === '1'){ chooseOption(0); }
        else if (k === '2'){ chooseOption(1); }
        return;
      }
      if (k === ' ' || k === 'Enter'){ advanceDialogue(); }
      return;
    }
    if (state === STATE_PLAY && DIR_KEYS[k]){
      var d = DIR_KEYS[k];
      attemptMove(d[0], d[1], d[2]);
    }
  });

  canvas.addEventListener('click', function(){
    if (state === STATE_TITLE) beginGame();
    else if (state === STATE_DIALOGUE) advanceDialogue();
  });

  function beginGame(){
    startRound1();
    state = STATE_PLAY;
    startMusic();
  }

  // ---------- drawing ----------
  function px(n){ return Math.round(n); }

  var DISCO_COLORS = ['#ff3d7f','#38e6ff','#ffcf3d','#8a4dff'];

  function drawFloorAndWalls(t){
    for (var gy=0; gy<ROWS; gy++){
      for (var gx=0; gx<COLS; gx++){
        var c = MAP[gy][gx];
        var x = gx*TILE, y = STATUS_H + gy*TILE;
        if (c === '#'){
          ctx.fillStyle = '#22284a';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle = '#171b33';
          ctx.fillRect(x,y,TILE,3);
          ctx.fillRect(x,y,3,TILE);
        } else if (c === 'D'){
          ctx.fillStyle = '#171b33';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle = '#5ee6c8';
          ctx.fillRect(x+2,y+2,TILE-6,TILE-4);
          ctx.fillStyle = '#0d1321';
          ctx.fillRect(x+TILE-8,y+TILE/2-1,3,3);
        } else if (isDanceFloor(gx,gy)){
          ctx.fillStyle = DISCO_COLORS[(gx+gy)%4];
          ctx.fillRect(x,y,TILE,TILE);
          var pulse = (Math.sin((t||0)*0.004 + gx*0.9 + gy*1.3) + 1) / 2;
          ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + pulse*0.28) + ')';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.strokeStyle = 'rgba(0,0,0,.25)';
          ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
        } else {
          ctx.fillStyle = ((gx+gy)%2===0) ? '#e8c99b' : '#dfbd88';
          ctx.fillRect(x,y,TILE,TILE);
        }
      }
    }
    // furniture on top
    FURNITURE.forEach(function(f){
      var x2 = f.gx*TILE, y2 = STATUS_H + f.gy*TILE;
      if (f.type === 'T'){
        ctx.fillStyle = 'rgba(0,0,0,.22)';
        ctx.fillRect(x2+2, y2+TILE-4, TILE-4, 2);
        ctx.fillStyle = '#8a5a34';
        ctx.fillRect(x2+1, y2+3, TILE-2, TILE-6);
        ctx.fillStyle = '#5a3a1f';
        ctx.fillRect(x2+1, y2+TILE-6, TILE-2, 3);
        ctx.fillStyle = '#a97b4f';
        ctx.fillRect(x2+1, y2+3, TILE-2, 2);
        // two little drinks on top
        ctx.fillStyle = '#f4ecd8';
        ctx.fillRect(x2+5, y2+5, 3, 4);
        ctx.fillRect(x2+TILE-8, y2+5, 3, 4);
        ctx.fillStyle = '#ff5d73';
        ctx.fillRect(x2+5, y2+7, 3, 2);
        ctx.fillStyle = '#ffd257';
        ctx.fillRect(x2+TILE-8, y2+7, 3, 2);
      } else if (f.type === 'C'){
        ctx.fillStyle = 'rgba(0,0,0,.2)';
        ctx.fillRect(x2+1, y2+TILE-4, TILE-2, 2);
        ctx.fillStyle = '#8b3f5e';
        ctx.fillRect(x2+1, y2+6, TILE-2, TILE-8);
        ctx.fillStyle = '#6c2e47';
        ctx.fillRect(x2+1, y2+6, TILE-2, 3);
        ctx.fillStyle = '#a85a78';
        ctx.fillRect(x2+1, y2+6, 2, TILE-8);
        ctx.strokeStyle = '#6c2e47';
        ctx.beginPath();
        ctx.moveTo(x2+TILE/2, y2+7); ctx.lineTo(x2+TILE/2, y2+TILE-3);
        ctx.stroke();
      }
    });
    // door label
    ctx.fillStyle = '#5ee6c8';
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('EXIT', 16*TILE+2, STATUS_H+4*TILE+6);
  }

  function drawActor(gx,gy,bodyColor,shadeColor,facing,hat,bobPhase,t,dancing,extraDy){
    var x = gx*TILE, y = STATUS_H + gy*TILE;
    var bobAmp = dancing ? 3 : 1;
    var bobSpeed = dancing ? 0.02 : 0.006;
    var bob = Math.sin((t||0)*bobSpeed + (bobPhase||0)) * bobAmp + (extraDy||0);
    var sway = dancing ? Math.sin((t||0)*0.015 + (bobPhase||0)) * 2 : 0;
    var cx = x + TILE/2, cy = y + TILE/2;
    ctx.save();
    ctx.translate(cx + sway, cy);
    if (dancing) ctx.rotate(Math.sin((t||0)*0.015 + (bobPhase||0)) * 0.18);
    ctx.translate(-cx, -cy);

    var bx = x+3, by = y+3+bob;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(x+3,y+TILE-4,TILE-6,3);
    ctx.fillStyle = shadeColor;
    ctx.fillRect(bx, by+4, TILE-6, TILE-8);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(bx, by+2, TILE-6, TILE-8);
    // head
    ctx.fillStyle = '#f2c9a0';
    ctx.fillRect(bx+2, by-3, TILE-10, 7);
    // eyes
    ctx.fillStyle = '#171b33';
    if (facing==='left'){ ctx.fillRect(bx+3, by, 2,2); }
    else if (facing==='right'){ ctx.fillRect(bx+TILE-11, by, 2,2); }
    else { ctx.fillRect(bx+3, by, 2,2); ctx.fillRect(bx+TILE-11, by, 2,2); }
    if (hat){
      ctx.fillStyle = '#ff5d73';
      ctx.beginPath();
      ctx.moveTo(bx+ (TILE-10)/2+2, by-9);
      ctx.lineTo(bx+2, by-3);
      ctx.lineTo(bx+TILE-8, by-3);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // three table-bumps in a row: little jump, then a couple of hiccups
  var EASTER_EGG_JUMP_MS = 380;
  var EASTER_EGG_HIC_MS = 420;

  function beerEggOffset(t){
    if (!playerEasterEgg) return { dy:0, hic:false, showMug:false };
    var elapsed = t - playerEasterEgg.startT;
    if (elapsed > EASTER_EGG_JUMP_MS + EASTER_EGG_HIC_MS){
      playerEasterEgg = null;
      return { dy:0, hic:false, showMug:false };
    }
    if (elapsed < EASTER_EGG_JUMP_MS){
      var p = elapsed / EASTER_EGG_JUMP_MS;
      return { dy: -Math.sin(p * Math.PI) * 9, hic:false, showMug: elapsed < EASTER_EGG_JUMP_MS * 0.75 };
    }
    var p2 = (elapsed - EASTER_EGG_JUMP_MS) / EASTER_EGG_HIC_MS;
    return { dy: -Math.abs(Math.sin(p2 * Math.PI * 2.5)) * 2.5, hic:true, showMug:false };
  }

  function drawBeerMug(gx, gy, dy){
    var x = gx*TILE, y = STATUS_H + gy*TILE + dy;
    var mx = x + TILE - 6, my = y - 1;
    ctx.fillStyle = '#ffd257';
    ctx.fillRect(mx, my, 5, 6);
    ctx.fillStyle = '#f4ecd8';
    ctx.fillRect(mx, my - 2, 5, 2);
    ctx.strokeStyle = '#cf9f22';
    ctx.lineWidth = 1;
    ctx.strokeRect(mx + 5, my + 1, 2, 3);
  }

  function drawHiccup(gx, gy, dy){
    var x = gx*TILE + TILE/2, y = STATUS_H + gy*TILE - 8 + dy;
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#5ee6c8';
    ctx.fillText('*hic*', x, y);
  }

  function drawPlayer(t){
    var dancing = isDanceFloor(player.gx, player.gy);
    var egg = beerEggOffset(t);
    drawActor(player.gx, player.gy, '#7ec4ff', '#3f8fd6', player.facing, false, 0, t, dancing, egg.dy);
    if (egg.showMug) drawBeerMug(player.gx, player.gy, egg.dy);
    if (egg.hic) drawHiccup(player.gx, player.gy, egg.dy);
  }

  function drawGuests(t){
    var target = currentTarget();
    guests.forEach(function(g){
      ctx.globalAlpha = g.farewelled ? 0.4 : 1;
      var dancing = isDanceFloor(g.gx, g.gy);
      drawActor(g.gx, g.gy, g.color, g.shade, g.facing, g.hat, g.bob, t, dancing);
      ctx.globalAlpha = 1;
      if (target && target.id === g.id){
        var x = g.gx*TILE, y = STATUS_H + g.gy*TILE;
        var bob = Math.sin(t*0.006)*2;
        ctx.fillStyle = '#ffd257';
        ctx.beginPath();
        ctx.moveTo(x+TILE/2, y-6+bob);
        ctx.lineTo(x+TILE/2-4, y-1+bob);
        ctx.lineTo(x+TILE/2+4, y-1+bob);
        ctx.closePath();
        ctx.fill();
      }
    });
  }

  function drawStatusBar(){
    ctx.fillStyle = '#171b33';
    ctx.fillRect(0,0,canvas.width,STATUS_H);
    ctx.fillStyle = '#2a3559';
    ctx.fillRect(0,STATUS_H-2,canvas.width,2);
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd257';
    ctx.textAlign = 'left';
    ctx.fillText('GOODBYES: ' + goodbyesRemaining, 4, STATUS_H/2);
    ctx.fillStyle = '#a9a3c9';
    ctx.textAlign = 'right';
    ctx.fillText('LOOP ' + (loopCount+1), canvas.width-4, STATUS_H/2);
  }

  function wrapText(text, maxChars){
    var words = text.split(' ');
    var lines = [], cur = '';
    words.forEach(function(w){
      if ((cur + ' ' + w).trim().length > maxChars){
        lines.push(cur.trim()); cur = w;
      } else cur = (cur + ' ' + w).trim();
    });
    if (cur) lines.push(cur);
    return lines;
  }

  var DIALOGUE_LINE_H = 11;
  var DIALOGUE_MIN_BH = 60;
  var DIALOGUE_BOTTOM_MARGIN = 6;
  var DIALOGUE_TOP_MARGIN = 4;

  function dialogueBoxRect(lineCount){
    var bx = 10, bw = 300;
    var textBlockH = Math.max(lineCount, 1) * DIALOGUE_LINE_H;
    var bh = 28 + textBlockH + 12; // header/speaker space + text + footer space
    bh = Math.max(bh, DIALOGUE_MIN_BH);
    var maxBh = 240 - STATUS_H - DIALOGUE_TOP_MARGIN - DIALOGUE_BOTTOM_MARGIN;
    bh = Math.min(bh, maxBh);
    var by = 240 - bh - DIALOGUE_BOTTOM_MARGIN;
    by = Math.max(by, STATUS_H + DIALOGUE_TOP_MARGIN);
    return { bx:bx, by:by, bw:bw, bh:bh };
  }

  function drawDialogueBox(){
    if (!dialogue.active) return;
    var step = currentStep();
    if (!step) return;
    var isSystem = step.type === 'line' && step.system;

    var lineCount = 2;
    var sysLines, lines;
    if (step.type === 'choice'){
      lineCount = step.options.length + 1;
    } else if (isSystem){
      sysLines = wrapText(step.text, 38);
      lineCount = sysLines.length;
    } else {
      lines = wrapText(step.text, 34);
      lineCount = lines.length + 1; // +1 for the speaker label row
    }

    var rect = dialogueBoxRect(lineCount);
    var bx = rect.bx, by = rect.by, bw = rect.bw, bh = rect.bh;

    ctx.fillStyle = '#0d1321';
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle = isSystem ? '#ffd257' : '#f4ecd8';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx+1,by+1,bw-2,bh-2);
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    if (step.type === 'choice'){
      ctx.fillStyle = '#5ee6c8';
      ctx.fillText('CHOOSE:', bx+8, by+14);
      step.options.forEach(function(opt, i){
        var y = by+30+i*14;
        var marker = (i === dialogue.selected) ? '> ' : '  ';
        ctx.fillStyle = (i === dialogue.selected) ? '#ffd257' : '#f4ecd8';
        ctx.fillText(marker + (i+1) + ') ' + opt.label, bx+8, y);
      });
      ctx.fillStyle = '#a9a3c9';
      ctx.font = '6px "Press Start 2P", monospace';
      ctx.textAlign = 'right';
      ctx.fillText('1/2 OR ENTER', bx+bw-8, by+bh-6);
      return;
    }

    if (isSystem){
      ctx.fillStyle = '#ffd257';
      ctx.textAlign = 'center';
      sysLines.forEach(function(l,i){
        ctx.fillText(l, bx+bw/2, by+18+i*DIALOGUE_LINE_H);
      });
    } else {
      ctx.fillStyle = '#5ee6c8';
      var speaker = step.who === 'you' ? 'YOU' : step.who.toUpperCase();
      ctx.fillText(speaker, bx+8, by+14);
      ctx.fillStyle = '#f4ecd8';
      lines.forEach(function(l,i){
        ctx.fillText(l, bx+8, by+28+i*DIALOGUE_LINE_H);
      });
    }
    ctx.fillStyle = '#a9a3c9';
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('SPACE >', bx+bw-8, by+bh-6);
  }

  function drawTitle(t){
    ctx.fillStyle = '#0d1321';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for (var i=0;i<40;i++){
      var sx = (i*53)%320, sy = (i*97 + (t*0.01))%240;
      ctx.fillStyle = i%3===0 ? '#2a3559' : '#171b33';
      ctx.fillRect(sx, sy%240, 2,2);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5d73';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillText('JUST ONE MORE', 160, 84);
    ctx.fillText('GOODBYE', 160, 104);
    ctx.fillStyle = '#a9a3c9';
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.fillText('you can leave whenever you want.', 160, 130);

    if (Math.floor(t/450)%2===0){
      ctx.fillStyle = '#5ee6c8';
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillText('PRESS START', 160, 176);
    }
    drawActor(5,7,'#7ec4ff','#3f8fd6','down',false,0,t);
    drawActor(9,7,'#ff9e5e','#d5702c','down',true,1,t);
    drawActor(7,8,'#a4e05a','#6fa930','down',true,2,t);
  }

  // ---------- audio (placeholder chiptune) ----------
  var audioCtx = null, soundOn = false, seqTimer = null;
  var notes = [261.6,329.6,392.0,329.6, 293.7,349.2,440.0,349.2];
  var ni = 0;
  function startMusic(){
    if (!soundOn) return;
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (seqTimer) return;
    seqTimer = setInterval(function(){
      if (!soundOn || !audioCtx) return;
      var freq = notes[ni % notes.length]; ni++;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }, 220);
  }
  function stopMusic(){
    if (seqTimer){ clearInterval(seqTimer); seqTimer = null; }
  }
  var soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    soundBtn.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF');
    if (soundOn) startMusic(); else stopMusic();
  });

  // ---------- main loop ----------
  function frame(t){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if (state === STATE_TITLE){
      drawTitle(t);
    } else {
      if (state === STATE_PLAY) updateGuestAI(t);
      drawFloorAndWalls(t);
      drawGuests(t);
      drawPlayer(t);
      drawStatusBar();
      drawDialogueBox();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
