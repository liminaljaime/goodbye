<title>Just One More Goodbye</title>
<style>
  :root{
    --bg:#0d1321;
    --panel:#171f33;
    --panel-edge:#2a3559;
    --wall:#22284a;
    --wall-dark:#171b33;
    --floor:#e8c99b;
    --floor-dark:#d9b686;
    --ink:#f4ecd8;
    --ink-dim:#a9a3c9;
    --accent:#ff5d73;
    --accent-2:#5ee6c8;
    --accent-3:#ffd257;
    --door:#5ee6c8;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0d1321; --panel:#171f33; --panel-edge:#2a3559; --ink:#f4ecd8;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 16px 24px;
    font-family:'Press Start 2P', monospace;
  }
  h1{display:none;}
  .cabinet{
    width:100%;
    max-width:720px;
    background:linear-gradient(180deg,var(--panel),var(--bg));
    border:4px solid var(--panel-edge);
    border-radius:14px;
    padding:14px;
    box-shadow:0 10px 0 rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.03);
  }
  .marquee{
    text-align:center;
    font-size:11px;
    letter-spacing:1px;
    color:var(--accent-3);
    text-shadow:0 2px 0 rgba(0,0,0,.5);
    margin-bottom:10px;
    line-height:1.8;
  }
  .marquee .sub{
    display:block;
    font-size:7px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .screen-wrap{
    position:relative;
    width:100%;
    aspect-ratio:320/240;
    background:#000;
    border-radius:6px;
    overflow:hidden;
    border:3px solid var(--wall-dark);
    box-shadow: inset 0 0 24px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04);
  }
  canvas{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    display:block;
  }
  .controls-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    gap:10px;
    flex-wrap:wrap;
  }
  .hint{
    font-size:7px;
    color:var(--ink-dim);
    line-height:1.9;
  }
  .btn{
    font-family:'Press Start 2P', monospace;
    font-size:8px;
    background:var(--panel-edge);
    color:var(--ink);
    border:2px solid var(--ink-dim);
    border-radius:4px;
    padding:8px 10px;
    cursor:pointer;
  }
  .btn:active{ transform:translateY(1px); }
  .btn:hover{ border-color:var(--accent-2); color:var(--accent-2); }
  .footer{
    text-align:center;
    margin-top:14px;
    font-size:7px;
    color:var(--ink-dim);
    line-height:1.8;
  }
  @media (max-width:480px){
    .marquee{ font-size:9px; }
    .marquee .sub{ font-size:6px; }
  }
</style>

    <button class="btn" id="soundBtn" type="button">SOUND: OFF</button>

  <div class="footer">A PARTY YOU CANNOT LEAVE &middot; EST. TONIGHT</div>

    var line = callbackLine(lastFarewellName, lastChar.gender);
    for (var i=0;i<steps.length;i++){
      if (steps[i].type === 'line' && steps[i].who === guest.name){
        var copy = steps.slice();
        var s = copy[i];
        copy[i] = { type:'line', who:s.who, text: line + " " + s.text, end: s.end };
        return copy;
      }
    }
    return steps;
  }

  var ARRIVAL_REASONS = [
    "has come back to the party from the off license with more booze",
    "has come back to the party from the kitchen with a fresh bag of crisps",
    "has come back to the party from the garden, still holding a cigarette",
    "has finally made it back from the bathroom queue",
    "has come back to the party from the car with a different speaker",
    "has come back to the party from the corner shop with more ice"
  ];

  // ---------- dialogue box control ----------
  function currentStep(){ return dialogue.steps[dialogue.idx]; }

  function gotoStep(i){
    if (i >= dialogue.steps.length){ closeDialogue(); return; }
    dialogue.idx = i;
    dialogue.selected = 0;
  }

  function openScript(steps, onDone){
    dialogue.steps = steps;
    dialogue.active = true;
    dialogue.onDone = onDone || null;
    state = STATE_DIALOGUE;
    gotoStep(0);
  }

  function closeDialogue(){
    dialogue.active = false;
    state = STATE_PLAY;
    var cb = dialogue.onDone; dialogue.onDone = null;
    if (cb) cb();
  }

  function advanceDialogue(){
    var step = currentStep();
    if (!step){ closeDialogue(); return; }
    if (step.type === 'choice') return;
    if (step.end){ closeDialogue(); return; }
    gotoStep(dialogue.idx+1);
  }

  function chooseOption(i){
    var step = currentStep();
    if (!step || step.type !== 'choice') return;
    var opt = step.options[i];
    if (!opt) return;
    gotoStep(opt.next);
  }

  function sayGoodbyeTo(guest){
    guest.farewelled = true;
    lastFarewellName = guest.name;
    queue.shift();
    goodbyesRemaining = queue.length;
    if (queue.length === 0){
      spawnArrival();
    }
  }

  function spawnArrival(){
    var name = nextName();
    var reason = ARRIVAL_REASONS[(Math.random()*ARRIVAL_REASONS.length)|0];
    var used = occupiedSpots();
    var spot = randomSpot(used);
    var g = spawnGuest(name, spot);
    g.arrival = true;
    queue = [g.id];
    goodbyesRemaining = queue.length;
    var steps = [
      {type:'line', who:'SYSTEM', text: name + " " + reason + ".", system:true, end:true}
    ];
    openScript(steps, null);
  }

  function resetRoster(excludeId, order){
    loopCount++;
    queue = order || shuffleArray(roster.filter(function(id){ return id !== excludeId; }));
    queue.forEach(function(id){
      var g = guestById(id);
      if (g) g.farewelled = false;
    });
    goodbyesRemaining = queue.length;
  }

  function tryTalk(guest){
    var target = currentTarget();
    if (guest.farewelled){
      openScript(alreadySaidByeSteps(guest), null);
      return;
    }
    if (target && target.id === guest.id){
      var t = effectiveTier(guest);
      var nextName_ = null;
      var newOrder = null;
      if (guest.arrival){
        // the new loop's order shuffles here so the arrival's hint always
        // points at whoever the reshuffled queue will actually start with
        newOrder = shuffleArray(roster.filter(function(id){ return id !== guest.id; }));
        var firstGuest = newOrder.length ? guestById(newOrder[0]) : null;
        nextName_ = firstGuest ? firstGuest.name : null;
      } else {
        var afterId = queue[1];
        if (afterId){
          var afterGuest = guestById(afterId);
          nextName_ = afterGuest ? afterGuest.name : null;
        }
      }
      var steps = withCallbackComment(withDanceComment(buildScript(guest, nextName_, t), guest), guest, t);
      openScript(steps, function(){
        lastFarewellName = guest.name;
        if (guest.arrival){
          guest.farewelled = true;
          guest.arrival = false;
          resetRoster(guest.id, newOrder);
        } else {
          sayGoodbyeTo(guest);
        }
      });
    } else {
      openScript(waitSteps(guest, target), null);
    }
  }

  function tryDoor(){
    openScript(doorSteps(), null);
  }

  // ---------- ambient guest movement ----------
  function tileOccupied(gx, gy, excludeGuest){
    if (player.gx === gx && player.gy === gy) return true;
    for (var i=0;i<guests.length;i++){
      var g = guests[i];
      if (g !== excludeGuest && g.gx === gx && g.gy === gy) return true;
    }
    return false;
  }

  var WANDER_DIRS = [[0,-1,'up'],[0,1,'down'],[-1,0,'left'],[1,0,'right']];

  function updateGuestAI(t){
    guests.forEach(function(g){
      if (t < g.nextMoveAt) return;
      g.nextMoveAt = t + 1200 + Math.random()*2600;
      if (Math.random() > 0.45) return; // often just lingers -- gathering, chatting
      var dirs = WANDER_DIRS.slice().sort(function(){ return Math.random()-0.5; });
      for (var i=0;i<dirs.length;i++){
        var nx = g.gx+dirs[i][0], ny = g.gy+dirs[i][1];
        if (isDoor(nx,ny)) continue;
        if (solidAt(nx,ny)) continue;
        if (tileOccupied(nx,ny,g)) continue;
        g.gx = nx; g.gy = ny; g.facing = dirs[i][2];
        break;
      }
    });
  }

  // ---------- input ----------
  var lastMove = 0;
  var MOVE_INTERVAL = 100;

  var DIR_KEYS = {
    'ArrowUp':[0,-1,'up'], 'w':[0,-1,'up'], 'W':[0,-1,'up'],
    'ArrowDown':[0,1,'down'], 's':[0,1,'down'], 'S':[0,1,'down'],
    'ArrowLeft':[-1,0,'left'], 'a':[-1,0,'left'], 'A':[-1,0,'left'],
    'ArrowRight':[1,0,'right'], 'd':[1,0,'right'], 'D':[1,0,'right']
  };

  function attemptMove(dx, dy, facing){
    var now = performance.now();
    if (now - lastMove < MOVE_INTERVAL) return;
    lastMove = now;
    player.facing = facing;
    var nx = player.gx+dx, ny = player.gy+dy;

    if (isDoor(nx,ny)){ tryDoor(); return; }
    if (solidAt(nx,ny)) return;

    var bump = null;
    for (var i=0;i<guests.length;i++){
      if (guests[i].gx===nx && guests[i].gy===ny){ bump = guests[i]; break; }
    }
    if (bump){ tryTalk(bump); return; }

    player.gx = nx; player.gy = ny;
  }

  window.addEventListener('keydown', function(e){
    var k = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter','w','a','s','d','W','A','S','D'].indexOf(k) !== -1){
      e.preventDefault();
    }

    if (state === STATE_TITLE){
      if (k === ' ' || k === 'Enter'){ beginGame(); }
      return;
    }
    if (state === STATE_DIALOGUE){
      var step = currentStep();
      if (step && step.type === 'choice'){
        if (k === 'ArrowUp'){ dialogue.selected = (dialogue.selected + step.options.length - 1) % step.options.length; }
        else if (k === 'ArrowDown'){ dialogue.selected = (dialogue.selected + 1) % step.options.length; }
        else if (k === ' ' || k === 'Enter'){ chooseOption(dialogue.selected); }
        else if (k === '1'){ chooseOption(0); }
        else if (k === '2'){ chooseOption(1); }
        return;
      }
      if (k === ' ' || k === 'Enter'){ advanceDialogue(); }
      return;
    }
    if (state === STATE_PLAY && DIR_KEYS[k]){
      var d = DIR_KEYS[k];
      attemptMove(d[0], d[1], d[2]);
    }
  });

  canvas.addEventListener('click', function(){
    if (state === STATE_TITLE) beginGame();
    else if (state === STATE_DIALOGUE) advanceDialogue();
  });

  function beginGame(){
    startRound1();
    state = STATE_PLAY;
    startMusic();
  }

  // ---------- drawing ----------
  function px(n){ return Math.round(n); }

  var DISCO_COLORS = ['#ff3d7f','#38e6ff','#ffcf3d','#8a4dff'];

  function drawFloorAndWalls(t){
    for (var gy=0; gy<ROWS; gy++){
      for (var gx=0; gx<COLS; gx++){
        var c = MAP[gy][gx];
        var x = gx*TILE, y = STATUS_H + gy*TILE;
        if (c === '#'){
          ctx.fillStyle = '#22284a';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle = '#171b33';
          ctx.fillRect(x,y,TILE,3);
          ctx.fillRect(x,y,3,TILE);
        } else if (c === 'D'){
          ctx.fillStyle = '#171b33';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle = '#5ee6c8';
          ctx.fillRect(x+2,y+2,TILE-6,TILE-4);
          ctx.fillStyle = '#0d1321';
          ctx.fillRect(x+TILE-8,y+TILE/2-1,3,3);
        } else if (isDanceFloor(gx,gy)){
          ctx.fillStyle = DISCO_COLORS[(gx+gy)%4];
          ctx.fillRect(x,y,TILE,TILE);
          var pulse = (Math.sin((t||0)*0.004 + gx*0.9 + gy*1.3) + 1) / 2;
          ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + pulse*0.28) + ')';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.strokeStyle = 'rgba(0,0,0,.25)';
          ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
        } else {
          ctx.fillStyle = ((gx+gy)%2===0) ? '#e8c99b' : '#dfbd88';
          ctx.fillRect(x,y,TILE,TILE);
        }
      }
    }
    // furniture on top
    FURNITURE.forEach(function(f){
      var x2 = f.gx*TILE, y2 = STATUS_H + f.gy*TILE;
      if (f.type === 'T'){
        ctx.fillStyle = 'rgba(0,0,0,.22)';
        ctx.fillRect(x2+2, y2+TILE-4, TILE-4, 2);
        ctx.fillStyle = '#8a5a34';
        ctx.fillRect(x2+1, y2+3, TILE-2, TILE-6);
        ctx.fillStyle = '#5a3a1f';
        ctx.fillRect(x2+1, y2+TILE-6, TILE-2, 3);
        ctx.fillStyle = '#a97b4f';
        ctx.fillRect(x2+1, y2+3, TILE-2, 2);
        // two little drinks on top
        ctx.fillStyle = '#f4ecd8';
        ctx.fillRect(x2+5, y2+5, 3, 4);
        ctx.fillRect(x2+TILE-8, y2+5, 3, 4);
        ctx.fillStyle = '#ff5d73';
        ctx.fillRect(x2+5, y2+7, 3, 2);
        ctx.fillStyle = '#ffd257';
        ctx.fillRect(x2+TILE-8, y2+7, 3, 2);
      } else if (f.type === 'C'){
        ctx.fillStyle = 'rgba(0,0,0,.2)';
        ctx.fillRect(x2+1, y2+TILE-4, TILE-2, 2);
        ctx.fillStyle = '#8b3f5e';
        ctx.fillRect(x2+1, y2+6, TILE-2, TILE-8);
        ctx.fillStyle = '#6c2e47';
        ctx.fillRect(x2+1, y2+6, TILE-2, 3);
        ctx.fillStyle = '#a85a78';
        ctx.fillRect(x2+1, y2+6, 2, TILE-8);
        ctx.strokeStyle = '#6c2e47';
        ctx.beginPath();
        ctx.moveTo(x2+TILE/2, y2+7); ctx.lineTo(x2+TILE/2, y2+TILE-3);
        ctx.stroke();
      }
    });
    // door label
    ctx.fillStyle = '#5ee6c8';
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('EXIT', 16*TILE+2, STATUS_H+4*TILE+6);
  }

  function drawActor(gx,gy,bodyColor,shadeColor,facing,hat,bobPhase,t,dancing){
    var x = gx*TILE, y = STATUS_H + gy*TILE;
    var bobAmp = dancing ? 3 : 1;
    var bobSpeed = dancing ? 0.02 : 0.006;
    var bob = Math.sin((t||0)*bobSpeed + (bobPhase||0)) * bobAmp;
    var sway = dancing ? Math.sin((t||0)*0.015 + (bobPhase||0)) * 2 : 0;
    var cx = x + TILE/2, cy = y + TILE/2;
    ctx.save();
    ctx.translate(cx + sway, cy);
    if (dancing) ctx.rotate(Math.sin((t||0)*0.015 + (bobPhase||0)) * 0.18);
    ctx.translate(-cx, -cy);

    var bx = x+3, by = y+3+bob;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(x+3,y+TILE-4,TILE-6,3);
    ctx.fillStyle = shadeColor;
    ctx.fillRect(bx, by+4, TILE-6, TILE-8);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(bx, by+2, TILE-6, TILE-8);
    // head
    ctx.fillStyle = '#f2c9a0';
    ctx.fillRect(bx+2, by-3, TILE-10, 7);
    // eyes
    ctx.fillStyle = '#171b33';
    if (facing==='left'){ ctx.fillRect(bx+3, by, 2,2); }
    else if (facing==='right'){ ctx.fillRect(bx+TILE-11, by, 2,2); }
    else { ctx.fillRect(bx+3, by, 2,2); ctx.fillRect(bx+TILE-11, by, 2,2); }
    if (hat){
      ctx.fillStyle = '#ff5d73';
      ctx.beginPath();
      ctx.moveTo(bx+ (TILE-10)/2+2, by-9);
      ctx.lineTo(bx+2, by-3);
      ctx.lineTo(bx+TILE-8, by-3);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPlayer(t){
    var dancing = isDanceFloor(player.gx, player.gy);
    drawActor(player.gx, player.gy, '#7ec4ff', '#3f8fd6', player.facing, false, 0, t, dancing);
  }

  function drawGuests(t){
    var target = currentTarget();
    guests.forEach(function(g){
      ctx.globalAlpha = g.farewelled ? 0.4 : 1;
      var dancing = isDanceFloor(g.gx, g.gy);
      drawActor(g.gx, g.gy, g.color, g.shade, g.facing, g.hat, g.bob, t, dancing);
      ctx.globalAlpha = 1;
      if (target && target.id === g.id){
        var x = g.gx*TILE, y = STATUS_H + g.gy*TILE;
        var bob = Math.sin(t*0.006)*2;
        ctx.fillStyle = '#ffd257';
        ctx.beginPath();
        ctx.moveTo(x+TILE/2, y-6+bob);
        ctx.lineTo(x+TILE/2-4, y-1+bob);
        ctx.lineTo(x+TILE/2+4, y-1+bob);
        ctx.closePath();
        ctx.fill();
      }
    });
  }

  function drawStatusBar(){
    ctx.fillStyle = '#171b33';
    ctx.fillRect(0,0,canvas.width,STATUS_H);
    ctx.fillStyle = '#2a3559';
    ctx.fillRect(0,STATUS_H-2,canvas.width,2);
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd257';
    ctx.textAlign = 'left';
    ctx.fillText('GOODBYES: ' + goodbyesRemaining, 4, STATUS_H/2);
    ctx.fillStyle = '#a9a3c9';
    ctx.textAlign = 'right';
    ctx.fillText('LOOP ' + (loopCount+1), canvas.width-4, STATUS_H/2);
  }

  function wrapText(text, maxChars){
    var words = text.split(' ');
    var lines = [], cur = '';
    words.forEach(function(w){
      if ((cur + ' ' + w).trim().length > maxChars){
        lines.push(cur.trim()); cur = w;
      } else cur = (cur + ' ' + w).trim();
    });
    if (cur) lines.push(cur);
    return lines;
  }

  var DIALOGUE_LINE_H = 11;
  var DIALOGUE_MIN_BH = 60;
  var DIALOGUE_BOTTOM_MARGIN = 6;
  var DIALOGUE_TOP_MARGIN = 4;

  function dialogueBoxRect(lineCount){
    var bx = 10, bw = 300;
    var textBlockH = Math.max(lineCount, 1) * DIALOGUE_LINE_H;
    var bh = 28 + textBlockH + 12; // header/speaker space + text + footer space
    bh = Math.max(bh, DIALOGUE_MIN_BH);
    var maxBh = 240 - STATUS_H - DIALOGUE_TOP_MARGIN - DIALOGUE_BOTTOM_MARGIN;
    bh = Math.min(bh, maxBh);
    var by = 240 - bh - DIALOGUE_BOTTOM_MARGIN;
    by = Math.max(by, STATUS_H + DIALOGUE_TOP_MARGIN);
    return { bx:bx, by:by, bw:bw, bh:bh };
  }

  function drawDialogueBox(){
    if (!dialogue.active) return;
    var step = currentStep();
    if (!step) return;
    var isSystem = step.type === 'line' && step.system;

    var lineCount = 2;
    var sysLines, lines;
    if (step.type === 'choice'){
      lineCount = step.options.length + 1;
    } else if (isSystem){
      sysLines = wrapText(step.text, 38);
      lineCount = sysLines.length;
    } else {
      lines = wrapText(step.text, 34);
      lineCount = lines.length + 1; // +1 for the speaker label row
    }

    var rect = dialogueBoxRect(lineCount);
    var bx = rect.bx, by = rect.by, bw = rect.bw, bh = rect.bh;

    ctx.fillStyle = '#0d1321';
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle = isSystem ? '#ffd257' : '#f4ecd8';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx+1,by+1,bw-2,bh-2);
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    if (step.type === 'choice'){
      ctx.fillStyle = '#5ee6c8';
      ctx.fillText('CHOOSE:', bx+8, by+14);
      step.options.forEach(function(opt, i){
        var y = by+30+i*14;
        var marker = (i === dialogue.selected) ? '> ' : '  ';
        ctx.fillStyle = (i === dialogue.selected) ? '#ffd257' : '#f4ecd8';
        ctx.fillText(marker + (i+1) + ') ' + opt.label, bx+8, y);
      });
      ctx.fillStyle = '#a9a3c9';
      ctx.font = '6px "Press Start 2P", monospace';
      ctx.textAlign = 'right';
      ctx.fillText('1/2 OR ENTER', bx+bw-8, by+bh-6);
      return;
    }

    if (isSystem){
      ctx.fillStyle = '#ffd257';
      ctx.textAlign = 'center';
      sysLines.forEach(function(l,i){
        ctx.fillText(l, bx+bw/2, by+18+i*DIALOGUE_LINE_H);
      });
    } else {
      ctx.fillStyle = '#5ee6c8';
      var speaker = step.who === 'you' ? 'YOU' : step.who.toUpperCase();
      ctx.fillText(speaker, bx+8, by+14);
      ctx.fillStyle = '#f4ecd8';
      lines.forEach(function(l,i){
        ctx.fillText(l, bx+8, by+28+i*DIALOGUE_LINE_H);
      });
    }
    ctx.fillStyle = '#a9a3c9';
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('SPACE >', bx+bw-8, by+bh-6);
  }

  function drawTitle(t){
    ctx.fillStyle = '#0d1321';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for (var i=0;i<40;i++){
      var sx = (i*53)%320, sy = (i*97 + (t*0.01))%240;
      ctx.fillStyle = i%3===0 ? '#2a3559' : '#171b33';
      ctx.fillRect(sx, sy%240, 2,2);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5d73';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillText('JUST ONE MORE', 160, 84);
    ctx.fillText('GOODBYE', 160, 104);
    ctx.fillStyle = '#a9a3c9';
    ctx.font = '7px "Press Start 2P", monospace';
    ctx.fillText('you can leave whenever you want.', 160, 130);

    if (Math.floor(t/450)%2===0){
      ctx.fillStyle = '#5ee6c8';
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.fillText('PRESS START', 160, 176);
    }
    drawActor(5,7,'#7ec4ff','#3f8fd6','down',false,0,t);
    drawActor(9,7,'#ff9e5e','#d5702c','down',true,1,t);
    drawActor(7,8,'#a4e05a','#6fa930','down',true,2,t);
  }

  // ---------- audio (placeholder chiptune) ----------
  var audioCtx = null, soundOn = false, seqTimer = null;
  var notes = [261.6,329.6,392.0,329.6, 293.7,349.2,440.0,349.2];
  var ni = 0;
  function startMusic(){
    if (!soundOn) return;
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (seqTimer) return;
    seqTimer = setInterval(function(){
      if (!soundOn || !audioCtx) return;
      var freq = notes[ni % notes.length]; ni++;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }, 220);
  }
  function stopMusic(){
    if (seqTimer){ clearInterval(seqTimer); seqTimer = null; }
  }
  var soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    soundBtn.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF');
    if (soundOn) startMusic(); else stopMusic();
  });

  // ---------- main loop ----------
  function frame(t){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if (state === STATE_TITLE){
      drawTitle(t);
    } else {
      if (state === STATE_PLAY) updateGuestAI(t);
      drawFloorAndWalls(t);
      drawGuests(t);
      drawPlayer(t);
      drawStatusBar();
      drawDialogueBox();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
